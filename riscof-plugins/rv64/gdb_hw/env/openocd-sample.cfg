adapter speed 1000

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi oscan1_mode off

adapter serial "FT960PTF"

gdb_port 20400
tcl_port 30400
telnet_port 40400
## bindto 0.0.0.0 can be used to cover all available interfaces.
## Uncomment bindto line to enable remote machine debug
bindto 0.0.0.0

## If ftdi_device_desc not specified, the device description is ignored during device selection.
## So if you want to specify a dedicated FTDI device, you can select following device description:
## "Dual RS232-HS" is for HummingBird Debugger V1
## "USB <-> JTAG-DEBUGGER" is for HummingBird Debugger V2
## Uncomment one which match your device description
# ftdi_device_desc "Dual RS232-HS"
# ftdi_device_desc "USB <-> JTAG-DEBUGGER"

transport select jtag

ftdi layout_init 0x0008 0x001b
ftdi layout_signal nSRST -oe 0x0020 -data 0x0020
ftdi layout_signal TCK -data 0x0001
ftdi layout_signal TDI -data 0x0002
ftdi layout_signal TDO -input 0x0004
ftdi layout_signal TMS -data 0x0008
ftdi layout_signal JTAG_SEL -data 0x0100 -oe 0x0100

if { [ info exists BOOT_HARTID ] } {
    puts "boot hart id expected to be $BOOT_HARTID"
    set BOOTHART $BOOT_HARTID
} else {
    puts "Set boot hart id to 0"
    set BOOTHART 0
}

if { ! [ info exists BDTYPE ] } {
    puts "Set BDTYPE to ku060"
    set BDTYPE ku060
}

set _CHIPNAME riscv

# create a tap for split mode cpu
if { [ info exists SPLITMODE ] } {
    if { $SPLITMODE > 1 } {
        jtag newtap $_CHIPNAME.1 cpu -irlen 5
        jtag newtap $_CHIPNAME.0 cpu -irlen 5
        set _TARGETNAME $_CHIPNAME.1.cpu
    } else {
        # hart1 hart0 in split mode
        if { $BOOTHART == 0 } {
            jtag newtap $_CHIPNAME.split cpu -irlen 5
            jtag newtap $_CHIPNAME cpu -irlen 5
        } else {
            jtag newtap $_CHIPNAME cpu -irlen 5
            jtag newtap $_CHIPNAME.split cpu -irlen 5
        }
        set _TARGETNAME $_CHIPNAME.cpu
    }
} else {
    jtag newtap $_CHIPNAME cpu -irlen 5
    set _TARGETNAME $_CHIPNAME.cpu
}

set _TARGETHARTNAME $_TARGETNAME
set _smp_command ""
if { [ info exists CORECNT ] } {
	puts "Set CORECNT to $CORECNT"
} else {
	puts "Set CORECNT to default 1"
	set CORECNT 1
}

if {  $CORECNT > 1  } {
	set _TARGETHARTNAME $_TARGETNAME.$BOOTHART
	for { set _core 0 } { $_core < $CORECNT } { incr _core } {
		set _command "target create $_TARGETNAME.$_core riscv -chain-position $_TARGETNAME"
		if { $_core == 0 } {
			set _command "$_command -rtos hwthread"
			set _smp_command "target smp $_TARGETNAME.$_core"
		} else {
			set _command "$_command -coreid $_core"
			set _smp_command "$_smp_command $_TARGETNAME.$_core"
		}
		eval $_command
	}
	eval $_smp_command
} else {
    if { [ info exists SPLITMODE ] } {
        if { $SPLITMODE > 1 } {
	        target create $_CHIPNAME.0.cpu riscv -chain-position $_CHIPNAME.0.cpu
	        target create $_CHIPNAME.1.cpu riscv -chain-position $_CHIPNAME.1.cpu
        } else {
            # split mode coreid is always 0
	        target create $_TARGETNAME riscv -chain-position $_TARGETNAME
        }
    } else {
	    target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid $BOOTHART
    }
}

if { $BDTYPE eq "rvstar" } {
    $_TARGETHARTNAME configure -work-area-phys 0x20000000 -work-area-size 0x5000 -work-area-backup 1
} else {
    $_TARGETHARTNAME configure -work-area-phys 0x80000000 -work-area-size 10000 -work-area-backup 1
}

if { [ info exists NOFLASH ] } {
    puts "No flash bank is set"
} else {
    set _FLASHNAME $_CHIPNAME.flash
    if { $BDTYPE eq "rvstar" } {
        flash bank $_FLASHNAME gd32vf103 0x08000000 0 0 0 $_TARGETHARTNAME
    } else {
        flash bank $_FLASHNAME nuspi 0x20000000 0 0 0 $_TARGETHARTNAME
    }
}

# Expose Nuclei self-defined CSRS range 770-800,835-850,1984-2032,2064-2070
# See https:
# Then user can view the csr register value in gdb using: info reg csr775 for CSR MTVT(0x307)
#riscv expose_csrs 770-800,835-850,1984-2040,2064-2070

init

#reset

if {[ info exists pulse_srst]} {
  ftdi_set_signal nSRST 0
  ftdi_set_signal nSRST z
}
halt

if { [ info exists NOFLASH ] } {
	puts "Will not prope flash device"
} else {
	puts "Disable flash protect, and prope flash device"
	# We must turn on this because otherwise the IDE version debug cannot download the program into flash
	flash protect 0 0 last off
}

if { [ info exists GDBSHUT ] } {
	puts "openocd will auto exit when gdb detatched"
	foreach t [target names] {
		puts [ format "Target: %s configured gdb-detach shutdown\n" $t ]
		$t configure -event gdb-detach {shutdown}
	}
}

if { [ info exists SEMIHOST ] } {
    arm semihosting enable
}

if { [ info exists CPUINFO ] } {
    puts "Check Nuclei CPU Core feature!"
    nuclei cpuinfo
}

